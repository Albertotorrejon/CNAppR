# Runs R CMD check on every push and pull request to master.
# The badge in README.md shows the result of the latest run.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Hard dependencies plus the Suggests the tests exercise. The BSgenome
      # reference genomes (~1 GB each) are left out; tests that need them skip.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::mockery
            bioc::GenomicRanges
            bioc::IRanges
            bioc::Rsamtools
            bioc::DNAcopy
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          upload-snapshots: true
